name: Deploy OCI

on:
  push:
    branches:
      - oci
  workflow_dispatch:

concurrency:
  group: deploy-oci
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      - name: Verify deployment
        timeout-minutes: 15
        env:
          STOCKMAN_BUILD_VERSION: ${{ github.sha }}
          STOCKMAN_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
        run: npm run deploy:verify

      - name: Package Next.js standalone
        timeout-minutes: 15
        env:
          STOCKMAN_BUILD_VERSION: ${{ github.sha }}
          STOCKMAN_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
        run: |
          set -euo pipefail
          release_dir=.next-deploy-verify/standalone
          test -f "$release_dir/server.js"
          mkdir -p "$release_dir/public/_next/static" "$release_dir/.next/static" "$release_dir/scripts" "$release_dir/deploy/oci" "$release_dir/db/migration"
          # Next standalone does not include hashed client assets by itself.
          # Without this copy, HTML returns 200 while every app chunk returns 404.
          cp -r .next-deploy-verify/static/. "$release_dir/.next/static/"
          cp -r public/. "$release_dir/public/"
          # Keep a public fallback for runtimes that do not resolve the standalone
          # .next/static directory after an atomic release switch.
          cp -r .next-deploy-verify/static/. "$release_dir/public/_next/static/"
          cp scripts/oci-cron.sh "$release_dir/scripts/oci-cron.sh"
          cp scripts/oci-rss-cron.sh "$release_dir/scripts/oci-rss-cron.sh"
          cp scripts/register-discord-commands.mjs "$release_dir/scripts/register-discord-commands.mjs"
          cp deploy/oci/nginx-stockman.conf "$release_dir/deploy/oci/nginx-stockman.conf"
          cp deploy/oci/stockman-cron.service "$release_dir/deploy/oci/stockman-cron.service"
          cp deploy/oci/stockman-cron.timer "$release_dir/deploy/oci/stockman-cron.timer"
          cp deploy/oci/stockman-rss.service "$release_dir/deploy/oci/stockman-rss.service"
          cp deploy/oci/stockman-rss.timer "$release_dir/deploy/oci/stockman-rss.timer"
          cp db/migration/*.sql "$release_dir/db/migration/"
          node -e "const fs=require('fs'); const p=require('./package.json'); fs.writeFileSync('.next-deploy-verify/standalone/build-info.json', JSON.stringify({version:p.version,commit:process.env.STOCKMAN_BUILD_VERSION||'unknown',builtAt:process.env.STOCKMAN_BUILD_TIME||new Date().toISOString()}));"
          tar -czf stockman-oci.tar.gz -C "$release_dir" .
          tar -tzf stockman-oci.tar.gz | grep -Fx './server.js'
          tar -tzf stockman-oci.tar.gz | grep -Fx './build-info.json'
          test "$(tar -tzf stockman-oci.tar.gz | grep -c '/.next/static/chunks/.*\.js$')" -gt 0
          tar -tzf stockman-oci.tar.gz | grep -Fx './scripts/oci-cron.sh'
          tar -tzf stockman-oci.tar.gz | grep -Fx './db/migration/V1__initial_schema.sql'

      - name: Configure SSH
        timeout-minutes: 3
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$OCI_HOST" || { echo "OCI_HOST secret is empty"; exit 1; }
          test -n "$OCI_SSH_PRIVATE_KEY" || { echo "OCI_SSH_PRIVATE_KEY secret is empty"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "Checking SSH host: $OCI_HOST"
          ssh-keyscan -T 10 -H "$OCI_HOST" >> ~/.ssh/known_hosts || { echo "ssh-keyscan failed: check OCI_HOST, port 22, and OCI firewall rules"; exit 1; }
          chmod 644 ~/.ssh/known_hosts
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keygen -y -f ~/.ssh/oci_key > ~/.ssh/oci_key.pub || { echo "ssh-keygen failed: OCI_SSH_PRIVATE_KEY is not a valid unencrypted private key"; exit 1; }
          ssh-keygen -lf ~/.ssh/oci_key.pub

      - name: Upload release
        timeout-minutes: 5
        run: |
          scp -i ~/.ssh/oci_key stockman-oci.tar.gz \
            "ubuntu@${{ secrets.OCI_HOST }}:/tmp/stockman-oci-${{ github.sha }}.tar.gz"
          scp -i ~/.ssh/oci_key deploy/oci/stockman-activate \
            "ubuntu@${{ secrets.OCI_HOST }}:/tmp/stockman-activate-${{ github.sha }}"

      - name: Activate release
        timeout-minutes: 10
        env:
          OCI_DEPLOY_PATH: ${{ secrets.OCI_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/oci_key "ubuntu@${{ secrets.OCI_HOST }}" \
            "sudo -n install -m 0755 '/tmp/stockman-activate-${{ github.sha }}' /usr/local/sbin/stockman-activate && sudo -n /usr/local/sbin/stockman-activate '$OCI_DEPLOY_PATH' '/tmp/stockman-oci-${{ github.sha }}.tar.gz'"
