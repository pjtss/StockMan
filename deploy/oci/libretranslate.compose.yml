services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: stockman-libretranslate
    restart: unless-stopped
    command: ["--host", "0.0.0.0", "--port", "5000", "--load-only", "en,ko", "--disable-web-ui"]
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LT_UPDATE_MODELS: "false"
    volumes:
      - libretranslate_models:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  libretranslate_models:
